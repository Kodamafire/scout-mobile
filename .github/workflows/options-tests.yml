name: Scout Options Foundation Tests
on:
  pull_request:
    paths:
      - 'scout_options/**'
      - 'test_scout_options.py'
      - 'test_options_dashboard.py'
      - 'options.html'
      - '.github/workflows/options-tests.yml'
  push:
    branches: ['feat/options-foundation']
    paths:
      - 'scout_options/**'
      - 'test_scout_options.py'
      - 'test_options_dashboard.py'
      - 'options.html'
      - '.github/workflows/options-tests.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-scout.txt
      - run: python -m unittest discover -q
