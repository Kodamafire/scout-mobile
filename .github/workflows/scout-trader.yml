name: Scout Trader Automatic Paper Cycle

on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scout-paper-cycle
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements-scout.txt

      - name: Run Scout paper cycle
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python scout_runner.py

      - name: Save dashboard and Scout memory
        run: |
          git config user.name "Scout Trader Bot"
          git config user.email "scout-trader@users.noreply.github.com"

          git add -f index.html .scout/scout_state_v43.json .scout/scout_cycle_history_v43.csv

          if git diff --cached --quiet; then
            echo "No Scout changes to save."
            exit 0
          fi

          git commit -m "Scout automatic cycle"

          echo "Syncing with latest main..."

          git fetch origin main

          git merge -X ours origin/main --no-edit || {
            echo "Automatic merge failed."
            git merge --abort || true
            exit 1
          }

          echo "Pushing Scout results..."
          git push origin HEAD:main
